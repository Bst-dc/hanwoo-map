<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>한우 사육 및 질병 발생 현황</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link href="https://cdn.jsdelivr.net/gh/sun-typeface/SUIT@2/fonts/static/woff2/SUIT.css" rel="stylesheet">
<style>
:root{--fb:"SUIT","Pretendard","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;--fh:"SUIT","Pretendard","Malgun Gothic",sans-serif}
/* 초지: 밝은 초록 (낮에 보기 편한 화면). 자료 없음은 베이지, 가장 낮은 구간은 연두 */
:root{
  --fh:var(--fb);
  --bg:#eef3ea; --panel:#fbfdf8; --ink:#1f2a1c; --muted:#40503b; --line:#d9e3d2;
  --sea:#e3edf0; --nodata:#d8d1bf; --stroke:#fbfdf8; --prov:#7f9276; --sido:#ffffff; --accent:#2f7d3a;
  --r0:#e4f2cf; --r1:#c6e3a0; --r2:#9fd07f; --r3:#72b45e; --r4:#489648; --r5:#2a7640; --r6:#145028;
  --radius:12px; --shadow:0 1px 2px rgba(30,60,30,.08); --maplift:inset 0 0 0 1px #d9e3d2;
}
*{box-sizing:border-box}
:root{color-scheme:light;accent-color:var(--accent)}
::selection{background:#bfe0b0;color:var(--ink)}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:4px}
svg#map path:focus-visible{outline:none}
h1,h2{text-wrap:balance}
.dt,.st,.note li{text-wrap:pretty}
.rl,.bars,.side{scrollbar-width:thin;scrollbar-color:var(--prov) transparent}
html,body{margin:0}
html{font-size:112.5%}
body{background:var(--bg);color:var(--ink);font-family:var(--fb);line-height:1.5;transition:background .3s,color .3s}
.wrap{max-width:1640px;margin:0 auto;padding:22px 18px 44px}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px;margin-bottom:14px}
h1{margin:0;font-family:var(--fh);font-size:1.7rem;font-weight:800;letter-spacing:-.02em}
.asof{color:var(--muted);font-size:.82rem;margin-top:2px}
.controls{display:flex;align-items:center;gap:14px;flex-wrap:wrap;font-size:.9rem}
.controls label{color:var(--muted)}
select,button.btn{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:calc(var(--radius) * .6);padding:6px 10px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:calc(var(--radius) * .7);overflow:hidden;background:var(--panel)}
.seg button{font:inherit;font-size:.85rem;color:var(--muted);background:none;border:0;padding:6px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel);font-weight:700}
.seg button:disabled{opacity:.35;cursor:not-allowed}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 0;margin:0 0 16px}
.kpi{padding:0 24px;min-width:0}
.kpi+.kpi{border-left:1px solid var(--line)}
.kpi span{display:block;font-size:.88rem;color:var(--muted)}
.kpi b{display:block;font-family:var(--fh);font-size:1.75rem;font-weight:700;letter-spacing:-.01em;line-height:1.25;margin-top:2px;overflow-wrap:anywhere}
.kpi b small{font-size:.5em;font-weight:500;color:var(--muted);margin-left:.25em;letter-spacing:0}
.kpi em{display:block;font-style:normal;font-size:.84rem;color:var(--muted);min-height:1.2em;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi em.up{color:#2a6f35}.kpi em.dn{color:#a3201a}
.kpi em .sm{display:none}
@media (max-width:640px){.kpis{padding:10px 0}.kpi{padding:0 9px}.kpi span{font-size:.7rem;line-height:1.3}.kpi b{font-size:1.02rem}.kpi:first-child b{white-space:nowrap}.kpi b small{margin-left:.15em}.kpi em{font-size:.7rem;line-height:1.3}.kpi em .lg{display:none}.kpi em .sm{display:inline}}
.grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:820px){.grid{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow)}
.picker{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.picker label{display:flex;align-items:center;gap:6px;font-size:.82rem;color:var(--muted)}
.picker select{max-width:9.5em;font-size:.88rem}
.picker select:disabled{opacity:.5}
.crumbbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-height:34px;margin-bottom:8px;font-size:.92rem}
.crumbbar .sep{color:var(--muted)}
.crumbbar button{font:inherit;background:none;border:0;color:var(--accent);cursor:pointer;padding:2px 5px;border-radius:6px;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.crumbbar b{padding:2px 5px;font-family:var(--fh)}
.crumbbar .back{margin-left:auto;color:var(--ink);border:1px solid var(--line);border-radius:calc(var(--radius) * .6);padding:3px 11px;text-decoration:none}
.hint{color:var(--muted);font-size:.8rem;margin-left:auto}
svg#map{width:100%;height:auto;display:block;background:var(--sea);border-radius:max(2px,calc(var(--radius) - 4px));box-shadow:var(--maplift);transition:background .3s}
svg#map path{vector-effect:non-scaling-stroke}
svg#map path.r,svg#map path.e{fill:var(--nodata)}      /* 색이 입혀지기 전 시작색 (기본 검정이 밝은 화면에서 번쩍이지 않게) */
svg#map path.r{stroke:var(--stroke);stroke-width:.7px;cursor:pointer;transition:opacity .3s,fill .3s}
svg#map path.r.pick{stroke:var(--accent);stroke-width:2.8px}
svg#map path.r.can:hover{stroke:var(--accent);stroke-width:2px}
svg#map path.r.off{pointer-events:none;cursor:default}
svg#map path.e{stroke:var(--stroke);stroke-width:.9px;cursor:pointer}
svg#map path.e:hover{stroke:var(--accent);stroke-width:2.2px}
svg#map path.e.sel{stroke:var(--accent);stroke-width:2.8px}
svg#map path.prov{fill:none;stroke:var(--sido);stroke-width:3.2px;stroke-linejoin:round;pointer-events:none;opacity:.95;transition:opacity .3s}
svg#map #emdLayer{transition:opacity .4s}
svg#map .odot{cursor:pointer}
svg#map .odot circle{vector-effect:non-scaling-stroke}
svg#map .odot .core{fill:var(--c);stroke:#fff;stroke-width:2.2px;animation:dotblink 1.3s ease-in-out infinite}
svg#map .odot .ring{fill:var(--c);transform-box:fill-box;transform-origin:center;animation:dotping 1.3s ease-out infinite}
@keyframes dotblink{0%,100%{opacity:1}50%{opacity:.45}}
@keyframes dotping{0%{transform:scale(.7);opacity:.55}100%{transform:scale(2.8);opacity:0}}
@media (prefers-reduced-motion:reduce){svg#map .odot .core,svg#map .odot .ring{animation:none}svg#map .odot .ring{opacity:.25}}
.dotnote{display:flex;align-items:center;flex-wrap:wrap;gap:4px 12px;margin-top:8px;font-size:.78rem;color:var(--muted)}
.dotnote span{display:inline-flex;align-items:center;gap:5px}
.dotnote i{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none;box-shadow:0 0 0 1.5px #fff,0 0 0 2.5px rgba(31,42,28,.25)}
svg#map text.sidolbl{font-weight:800;letter-spacing:-.02em}
svg#map text{pointer-events:none;text-anchor:middle;dominant-baseline:central;fill:var(--ink);stroke:var(--panel);stroke-linejoin:round;paint-order:stroke;font-weight:700}
.legend{margin-top:12px;font-size:.78rem;color:var(--muted)}
.legend .scope{margin-bottom:6px}
.legend .ramp{display:flex;gap:2px}
.legend .ramp div{flex:1;min-width:0}
.legend .ramp i{display:block;height:10px;border-radius:2px}
.legend .ramp small{display:block;margin-top:3px;font-size:.7rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.legend .nd{display:inline-flex;align-items:center;gap:5px;margin-top:6px}
.legend .nd i{width:12px;height:12px;border-radius:3px;border:1px solid var(--line);background:var(--nodata)}
#tip{position:fixed;z-index:10;pointer-events:none;background:var(--ink);color:var(--panel);padding:5px 10px;border-radius:calc(var(--radius) * .6);font-size:.82rem;line-height:1.35;opacity:0;transition:opacity .08s;white-space:nowrap}
#tip b{font-family:var(--fh)}
.detail{min-height:352px}
.detail h2{margin:0;font-family:var(--fh);font-size:1.2rem;font-weight:800}
.detail .big{font-family:var(--fh);font-size:2.2rem;font-weight:800;letter-spacing:-.02em;color:var(--accent);margin:4px 0 0}
.detail .meta{color:var(--muted);font-size:.85rem}
.detail ol{margin:8px 0 0;padding-left:20px;font-size:.9rem}
.detail li{display:flex;justify-content:space-between;gap:12px;padding:1px 0}
h3,h2.lh{margin:0 0 8px;font-size:.95rem}
/* 막대 목록: 이름 칸은 가장 긴 이름에 맞추고(최대 9.5em) 남는 폭을 모두 막대에 준다 */
.bars{display:grid;grid-template-columns:fit-content(9.5em) minmax(24px,1fr) max-content;gap:3px 8px;align-content:start;max-height:420px;overflow:auto}
.bar{grid-column:1/-1;display:grid;grid-template-columns:subgrid;align-items:center;font-size:.82rem;cursor:pointer;padding:1px 3px;border-radius:6px}
@supports not (grid-template-columns:subgrid){.bar{grid-template-columns:7em minmax(24px,1fr) 4.6em;gap:8px}}
.bar:hover,.bar.sel{background:var(--bg)}
.bar.sel .l{font-weight:700}
.bar .t{height:9px;background:var(--r4);border-radius:5px;min-width:2px}
.bar .n{text-align:right;font-variant-numeric:tabular-nums}
.bar .l{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side{display:grid;gap:16px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:1000px){.two{grid-template-columns:1fr}}
/* 지도 카드와 오른쪽 칸 높이 맞추기
   넓은 화면: 오른쪽 칸은 지도 카드 높이를 따르고(contain:size), 목록이 남는 높이를 채우며 안에서 스크롤.
   상세 칸은 가장 긴 내용(경북 시군구 등, 약 680px)에 맞춰 높이를 고정해서, 호버로 내용이 바뀌어도 아래 목록이 밀려 깜빡이지 않게 한다.
   목록이 너무 낮아지지 않게 오른쪽 칸 최소 높이 = 상세 + 16 + 240 (이보다 지도가 낮으면 지도 카드가 늘어남) */
@media (min-width:1001px){
  .grid{align-items:stretch}
  .side{contain:size;display:flex;flex-direction:column;gap:16px;min-height:608px}
  .side:has(.detail.hw){min-height:956px}
  .side .detail{flex:none}
  .detail.hw{height:700px;overflow:auto}     /* 높이 고정: 호버로 내용이 바뀌어도 아래 목록이 밀리지 않게 */
  .two{flex:1;min-height:0;grid-auto-rows:minmax(0,1fr)}
  .two .card{display:flex;flex-direction:column;min-height:0}
  .two .bars{flex:1;min-height:0;max-height:none}
}
/* 중간 화면: 상세는 지도 옆(지도 높이로 늘림), 목록 두 개는 아래 전체 폭에 나란히 */
@media (min-width:821px) and (max-width:1000px){
  .grid{align-items:stretch}
  .side{display:contents}
  .two{grid-column:1/-1;grid-template-columns:1fr 1fr}
}
.alert{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 16px;margin:0 0 16px}
@media (max-width:820px){.alert{grid-template-columns:1fr}}
.alert h2{margin:0;font-size:1.15rem}
.alert .ah{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;margin-bottom:8px}
.alert .ah small{color:#33422f;font-size:.82rem}
.alert .stale{color:#7a4b00;background:#fff3d6;border:1px solid #ecd49a;border-radius:6px;padding:0 6px}
.gs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:520px){.gs{gap:6px}.g1{padding:8px 4px 8px}.g1 .gh{flex-direction:column;gap:3px}.g1 .gh b{font-size:.84rem}.g1 .pill{font-size:.7rem;padding:0 8px}.g1 .dt{font-size:.68rem}.g1 .st{display:none}.g1 .bs{font-size:.6rem;padding:0 5px}}
.g1{background:var(--bg);border-radius:12px;padding:10px 12px 12px;display:grid;gap:2px;justify-items:center;text-align:center}
.g1 .gh{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px}
.g1 .gh b{font-size:1.1rem}
.g1 .pill{font-size:.84rem;font-weight:800;border-radius:999px;padding:1px 10px;white-space:nowrap}
.g1 .pill.l1{background:#dff1fb;color:#0a6aa1}
.g1 .pill.l2{background:#fff0c2;color:#7a5a00}
.g1 .pill.l3{background:#fbdcd9;color:#a3201a}
.g1 svg{display:block;width:100%;max-width:180px;margin:0 auto}
.g1 .dt{font-size:.86rem;line-height:1.4;font-weight:700;margin-top:2px;color:var(--ink)}
.g1 .st{font-size:.8rem;line-height:1.4;color:#33422f}
.g1 .bs{display:inline-block;font-size:.76rem;font-weight:700;border-radius:999px;padding:1px 9px;margin-top:4px;background:#cfe9d6;color:#123d26}
.g1 .bs.screen{background:#e6e1d2;color:#3f3a2a}
.rl{list-style:none;margin:0;padding:0;font-size:.86rem}
.rl li{display:grid;grid-template-columns:10px 3.2em auto minmax(0,1fr);gap:6px;align-items:baseline;padding:4px 0;border-top:1px solid var(--line)}
.rl .dot{width:9px;height:9px;border-radius:50%;align-self:center;background:var(--c,#e5473f);animation:blink 1.3s ease-in-out infinite}
.rl .dot.off{background:transparent;animation:none}
@keyframes blink{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(244,131,125,.6)}50%{opacity:.3;box-shadow:0 0 0 6px rgba(244,131,125,0)}}
@media (prefers-reduced-motion:reduce){.rl .dot{animation:none}}
.alert .ah .lg{display:inline-flex;align-items:center;gap:5px}
.alert .ah .lg i{width:8px;height:8px;border-radius:50%;background:#e5473f}
.rl li:first-child{border-top:0}
.rl .d{color:#33422f;font-weight:600;font-variant-numeric:tabular-nums}
.rl .k{font-weight:700;white-space:nowrap}
.rl .k.fmd,.rl .k.lsd,.rl .k.tb{color:#a02d1f}
.rl .l{min-width:0}
.rl .l small{color:#33422f}
.alert .src{font-size:.8rem;line-height:1.5;color:#33422f;margin-top:8px}
.alert .src a{color:#1b5e2a;font-weight:700}
.note{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:18px;font-size:.8rem;line-height:1.55;color:var(--ink)}
@media (max-width:820px){.note{grid-template-columns:1fr}}
.note .nt{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px 16px;box-shadow:var(--shadow)}
.note h2{margin:0 0 6px;font-size:.84rem;font-weight:700;color:var(--ink)}
.note .nt.warnbox{background:#fff8e6;border-color:#ecd49a}
.note ul{margin:0;padding-left:1.1em}
.note li{margin:3px 0}
.note li::marker{color:var(--muted)}
.note b{font-weight:700}
.note .dim{color:var(--muted)}
.empty{color:var(--muted);font-size:.9rem}
.tchart{position:relative;height:58px;margin:8px 0 0 62px;cursor:crosshair}
.tchart svg{display:block;width:100%;height:100%}
.tchart .ty{position:absolute;left:-62px;font-size:.7rem;color:var(--muted);font-variant-numeric:tabular-nums;line-height:1;transform:translateY(-50%)}
.tchart .tdot,.tchart .tcur i{position:absolute;width:7px;height:7px;margin:-3.5px 0 0 -3.5px;border-radius:50%;background:var(--r5);box-shadow:0 0 0 2px var(--panel)}
.tchart .tcur{position:absolute;top:0;bottom:0;width:0;border-left:1px dashed var(--prov);display:none}
.tchart .tcur i{left:0}
.tyr{position:relative;height:16px;margin-left:62px;font-size:.7rem;color:var(--muted)}
.tyr span{position:absolute;top:2px;transform:translateX(-50%);font-variant-numeric:tabular-nums}
.tread{font-size:.8rem;font-variant-numeric:tabular-nums;margin-top:2px;min-height:1.3em}
.szl{display:flex;gap:14px;font-size:.75rem;color:var(--muted);margin:0 0 4px}
.szl i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.sz{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:10px;align-items:center;padding:5px 0;border-top:1px solid var(--line);font-size:.8rem}
.sz .b{display:grid;gap:3px}
.sz .b i{display:block;height:7px;border-radius:2px;min-width:2px}
.sz .n{text-align:right;font-variant-numeric:tabular-nums;line-height:1.35;white-space:nowrap}
.sz .n small{color:var(--muted)}
.info{font-size:.78rem;line-height:1.45;color:#1f4d33;background:#e6f3ea;border:1px solid #bcdcc6;border-radius:8px;padding:7px 10px;margin-top:10px}
.warn{font-size:.78rem;line-height:1.45;color:#7a4b00;background:#fff3d6;border:1px solid #ecd49a;border-radius:8px;padding:7px 10px;margin-top:12px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><h1>한우 사육 및 질병 발생 현황</h1><div class="asof" id="asof"></div></div>
    <div class="controls">
      <span class="seg" id="metricSeg" role="group" aria-label="한우 지표">
        <button data-m="hw" title="한우 사육 두수 (KOSIS 분기, 시군구)">한우 두수</button><button data-m="hwfarm" title="한우 농가(농장) 수 (KOSIS 분기)">한우 농가</button><button data-m="hwavg" title="한우 농가 1호당 두수">농가당 두수</button><button data-m="calf" title="한육우 중 1세 미만(송아지) 비중 (KOSIS 분기)">송아지 비중</button><button data-m="big" title="100두 이상 농가가 키우는 두수 비중 (공공데이터포털 15147310, 연 1회)">100두+ 비중</button>
      </span>
    </div>
  </header>
  <div class="kpis" id="kpis"></div>
  <section class="alert" id="alert" aria-label="가축질병 위기경보" hidden></section>

  <div class="grid">
    <div class="card">
      <div class="picker" role="group" aria-label="지역 선택">
        <label>시도 <select id="selSido" aria-label="시도 선택"></select></label>
        <label>시군구 <select id="selSg" aria-label="시군구 선택"></select></label>
        <label>읍면동 <select id="selEmd" aria-label="읍면동 선택"></select></label>
      </div>
      <div class="crumbbar" id="crumbs"></div>
      <svg id="map" role="img" aria-label="한우 사육 및 질병 발생 지도">
        <g id="regions"></g><g id="emdLayer"></g><path class="prov" id="borders"></path><g id="labels"></g><g id="inset"></g><g id="dots"></g>
      </svg>
      <div class="legend" id="legend"></div>
      <div class="dotnote" id="dotnote" hidden></div>
    </div>

    <div class="side">
      <div class="card detail hw" id="detail"></div>
      <div class="two">
        <div class="card"><h2 class="lh" id="t1"></h2><div class="bars" id="p1"></div></div>
        <div class="card"><h2 class="lh" id="t2"></h2><div class="bars" id="p2"></div></div>
      </div>
    </div>
  </div>

  <p class="note" id="note"></p>
</div>
<div id="tip"></div>

<script>
const DATA = __DATA__;
const fmt = n => Number(n).toLocaleString('ko-KR');
const $ = id => document.getElementById(id);
const NS = 'http://www.w3.org/2000/svg';
const svg = $('map');

let view = {level: 0, sido: null, sg: null};
let pickedSg = null;        // 선택 상자로 고른 시군구 (시도 화면에 머물며 강조)
let pinned = null;          // 읍면동 단계에서 고정한 읍면동
let emdList = [];           // 현재 시군구의 읍면동
let box = null, fullBox = null, anim = 0;

const feats = DATA.feats;

  const ease = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;

function sidoBox(code2) {

  const items = feats.filter(f => f.code2 === code2).map(f => f.el.getBBox());
  const areaSum = items.reduce((a, b) => a + b.width * b.height, 0);
  // 멀리 떨어진 작은 섬(울릉도 등)은 확대 범위에서 제외
  const main = items.filter(b => b.width * b.height >= areaSum * 0.015);
  let u = union(main.length ? main : items);
  const pu = pad(u, .05);

    b.x >= pu.x && b.y >= pu.y && b.x + b.width <= pu.x + pu.w && b.y + b.height <= pu.y + pu.h);
  if (rest.length) u = union([...main, ...rest]);

function drawSidoLabels() {
  const g = $('labels'), s = svg.clientWidth / box.w;

  const px = 14, fs = px / s, placed = [];
  const items = sidoCodes.map(c => {
    const b = sidoBox(c), name = sidoName[c];
    return {name, x: (b.x + b.w / 2) * s, y: (b.y + b.h / 2) * s, w: name.length * px + 8, h: px + 6, area: b.w * b.h};
  }).sort((a, b) => b.area - a.area);
  items.forEach(it => {                      // 겹치면 위·아래·옆으로 조금 비켜 놓고, 그래도 겹치면 건너뜀
    const spots = [[0, 0], [0, 15], [0, -15], [26, 0], [-26, 0], [0, 30], [0, -30]];
    const hit = (x, y) => placed.some(q => Math.abs(q.x - x) < (q.w + it.w) / 2 && Math.abs(q.y - y) < (q.h + it.h) / 2);
    const sp = spots.find(([dx, dy]) => !hit(it.x + dx, it.y + dy));
    if (!sp) return;
    const x = it.x + sp[0], y = it.y + sp[1];
    placed.push({x, y, w: it.w, h: it.h});
    const el = document.createElementNS(NS, 'text');
    el.setAttribute('x', x / s); el.setAttribute('y', y / s);
    el.setAttribute('font-size', fs); el.setAttribute('stroke-width', fs * .3);
    el.setAttribute('class', 'sidolbl');
    el.textContent = it.name;
    g.appendChild(el);
  });
}
/* ---------- 최근 발생 지역: 지도 위 깜빡이는 붉은 점 (disease_status.json 의 recent, 30일 이내) ---------- */
const SIDO2 = {'서울': ['11'], '부산': ['21'], '대구': ['22'], '인천': ['23'], '광주': ['24'], '대전': ['25'], '울산': ['26'], '세종': ['29'],
  '경기': ['31'], '강원': ['32'], '충북': ['33'], '충남': ['34'], '전북': ['35'], '전남': ['36'], '전남광주': ['36', '24'], '경북': ['37'], '경남': ['38'], '제주': ['39']};
const DIS = {fmd: ['구제역', '#e5473f'], ai: ['AI', '#7b3fb8'], asf: ['ASF', '#f08a00'], lsd: ['럼피스킨', '#1b78d6'], tb: ['결핵병', '#d6338f'], etc: ['기타', '#4a4a4a']};
const disKey = s => /구제역/.test(s) ? 'fmd' : /AI|조류/.test(s) ? 'ai' : /ASF|아프리카/.test(s) ? 'asf' : /럼피스킨/.test(s) ? 'lsd' : /결핵/.test(s) ? 'tb' : 'etc';
const DOT_ALIAS = {'애월': '제주시'};     // 읍면 이름으로 적힌 곳은 속한 시로
function outbreakSpots() {
  const D = DATA.disease, spots = new Map();
  if (!D) return [];
  const md = s => `${+s.slice(5, 7)}/${+s.slice(8, 10)}`;
  D.recent.filter(r => isFresh(r.d)).forEach(r => {
    r.loc.split(' · ').forEach(part => {
      const i = part.indexOf(' '), codes = SIDO2[part.slice(0, i)];
      if (!codes) return;
      part.slice(i + 1).split('·').forEach(raw => {
        const n = DOT_ALIAS[raw.trim()] || raw.trim(), c = feats.filter(f => codes.includes(f.code2));
        const f = [n, n + '군', n + '시', n + '구'].map(x => c.find(g => g.name === x)).find(Boolean) || c.find(g => g.name.startsWith(n + '시'));
        if (!f) return;
        if (!spots.has(f.id)) spots.set(f.id, {f, items: [], emds: new Map()});
        spots.get(f.id).items.push({k: disKey(r.dis), txt: `${md(r.d)} ${r.dis} (${r.sp})`});
      });
    });
    (r.emd || []).forEach(s => {                  // '시군 읍면동' (KAHIS 공개 주소의 읍면동까지만, 리·농장명은 싣지 않는다)
      const [sg, en] = s.split(' '), sp = [...spots.values()].find(x => x.f.name === sg);
      if (!sp || !en) return;
      if (!sp.emds.has(en)) sp.emds.set(en, []);
      sp.emds.get(en).push({k: disKey(r.dis), txt: `${md(r.d)} ${r.dis} (${r.sp})`});
    });
  });
  return [...spots.values()];
}
function innerPoint(el) {                        // 경계 상자 중심이 지역 밖(섬·오목한 모양)이면, 중심에 가장 가까운 지역 안쪽 점
  const b = el.getBBox(), cx = b.x + b.width / 2, cy = b.y + b.height / 2;
  if (el.isPointInFill(new DOMPoint(cx, cy))) return [cx, cy];
  let best = null, bd = 1e18;
  for (let i = 1; i < 24; i++) for (let j = 1; j < 24; j++) {
    const x = b.x + b.width * i / 24, y = b.y + b.height * j / 24, d = (x - cx) ** 2 + (y - cy) ** 2;
    if (d < bd && el.isPointInFill(new DOMPoint(x, y))) { bd = d; best = [x, y]; }
  }
  return best || [cx, cy];
}
function drawDots() {
  const g = $('dots'), note = $('dotnote'); g.innerHTML = '';
  let targets = [], tail = '';
  if (view.level === 2) {                        // 읍면동 화면: 이 시군에서 최근 발생한 읍면동에 점
    const sp = outbreakSpots().find(s => s.f === view.sg);
    if (sp) {
      let miss = 0;
      sp.emds.forEach((items, name) => {
        const e = emdList.find(x => x.name === name);
        if (e) targets.push({el: e.el, label: `${view.sg.sido} ${view.sg.name} ${name}`, items}); else miss++;
      });
      tail = sp.emds.size ? `최근 30일 이 시군 발생 읍면동 ${targets.length}곳${miss ? ` (지도에 없는 이름 ${miss}곳 제외)` : ''} · 점에 마우스를 올리면 내용이 보입니다`
        : '이 시군의 최근 발생은 읍면동 정보가 없어 시군 단위로만 표시합니다';
      if (!targets.length) { note.hidden = false; note.innerHTML = `<span>${tail}</span>`; return; }
    }
  } else {
    targets = outbreakSpots().map(s => ({el: s.f.el, label: `${s.f.sido} ${s.f.name}`, items: s.items, f: s.f}));
    tail = `최근 30일 발생 시군 ${targets.length}곳 · 점에 마우스를 올리면 내용이 보입니다`;
  }
  note.hidden = !targets.length;
  if (!targets.length) return;
  const used = [...new Set(targets.flatMap(s => s.items.map(i => i.k)))].sort((x, y) => Object.keys(DIS).indexOf(x) - Object.keys(DIS).indexOf(y));
  note.innerHTML = used.map(k => `<span style="--c:${DIS[k][1]}"><i></i>${DIS[k][0]}</span>`).join('') + `<span>${tail}</span>`;
  const k = Math.min(svg.clientWidth / box.w, svg.clientHeight / box.h) || 1, r = 8 / k;
  targets.forEach(({el: area, label, items}) => {
    const [x0, y00] = innerPoint(area), kinds = [...new Set(items.map(i => i.k))];
    const y0 = view.level === 2 ? y00 - 11 / k : y00;        // 읍면동 화면은 이름 글자 위에 얹어 글자를 가리지 않게
    const html = `<b>${label}</b><br>${items.map(i => `<span style="color:${DIS[i.k][1]}">●</span> ${i.txt}`).join('<br>')}`;
    kinds.forEach((kd, n) => {
      const x = x0 + (n - (kinds.length - 1) / 2) * r * 1.9, y = y0;
      const el = document.createElementNS(NS, 'g');
      el.setAttribute('class', 'odot'); el.style.setProperty('--c', DIS[kd][1]);
      el.innerHTML = `<circle class="ring" cx="${x}" cy="${y}" r="${r}"/><circle class="core" cx="${x}" cy="${y}" r="${r * .7}"/>`;
      el.addEventListener('mouseenter', ev => tip(ev, html));
      el.addEventListener('mousemove', ev => tip(ev, html));
      el.addEventListener('mouseleave', tipOff);
      el.addEventListener('click', () => area.dispatchEvent(new MouseEvent('click', {bubbles: true})));
      g.appendChild(el);
    });
  });
}

/* ---------- 지역 선택 상자 (시도 → 시군구 → 읍면동) ---------- */
const optHtml = (all, rows) => `<option value="">${all}</option>` + rows.map(([v, l]) => `<option value="${v}">${l}</option>`).join('');
const sidoCodes = [...new Set(feats.map(f => f.code2))];
$('selSido').innerHTML = optHtml('전국', sidoCodes.map(c => [c, sidoName[c]]));
function syncPicker() {
  const sg = $('selSg'), em = $('selEmd'), cur = view.level === 2 ? view.sg : pickedSg;     // 지금 고른 시군구
  $('selSido').value = view.sido || '';
  sg.disabled = view.level < 1;
  sg.innerHTML = view.level < 1 ? optHtml('시도를 먼저', []) : optHtml('전체', feats.filter(f => f.code2 === view.sido).map(f => [f.id, f.name]).sort((a, b) => a[1].localeCompare(b[1], 'ko')));
  sg.value = cur ? cur.id : '';
  em.disabled = !cur;
  em.innerHTML = !cur ? optHtml('시군구를 먼저', []) : optHtml('전체', (DATA.emds[cur.id] || []).map(r => [r[0], r[0]]));
  em.value = pinned ? pinned.name : '';
}
$('selSido').addEventListener('change', e => { if (e.target.value) goSido(e.target.value); else goTop(); });
// 시군구를 고르면 시도 화면에 머물며 그 시군구를 강조한다(지표 5개 모두 사용). 읍면동 화면은 읍면동 상자나 지도 클릭으로
$('selSg').addEventListener('change', e => { if (e.target.value) pickSg(byId[e.target.value]); else goSido(view.sido); });
$('selEmd').addEventListener('change', e => {
  const v = e.target.value;
  if (view.level === 2) { pinned = v === '' ? null : (emdList.find(x => x.name === v) || null); markSel(); showContext(); }
  else if (v && pickedSg) goSg(pickedSg, v);
});

/* ---------- 가축질병 위기경보 게이지 + 최근 발생 지역 (disease_status.json, 수동 갱신) ---------- */
const LVNAME = ['', '관심', '주의', '심각'];
function gaugeSvg(level, name) {
  const cx = 60, cy = 60, r = 44, rin = 29, pt = (deg, rad) => [cx + rad * Math.sin(deg * Math.PI / 180), cy - rad * Math.cos(deg * Math.PI / 180)];
  const f1 = n => n.toFixed(1);
  const arc = (a0, a1, col, on) => {                 // 현재 단계만 진하게, 나머지는 옅게 (구간 사이에 작은 틈)
    const [x0, y0] = pt(a0, r), [x1, y1] = pt(a1, r), [x2, y2] = pt(a1, rin), [x3, y3] = pt(a0, rin);
    return `<path d="M${f1(x0)} ${f1(y0)} A${r} ${r} 0 0 1 ${f1(x1)} ${f1(y1)} L${f1(x2)} ${f1(y2)} A${rin} ${rin} 0 0 0 ${f1(x3)} ${f1(y3)}Z" fill="${col}" opacity="${on ? 1 : .38}"/>`;
  };
  const lbl = (deg, txt, col, on) => { const [x, y] = pt(deg, r + 8); return `<text x="${f1(x)}" y="${f1(y)}" transform="rotate(${deg} ${f1(x)} ${f1(y)})" text-anchor="middle" dominant-baseline="central" font-size="9" font-weight="${on ? 800 : 700}" fill="${col}">${txt}</text>`; };
  const [nx, ny] = pt([-60, 0, 60][level - 1], 36);
  return `<svg viewBox="0 -2 120 68" role="img" aria-label="${name} 위기경보 ${LVNAME[level]}">${arc(-88, -31, '#2fb0ee', level === 1)}${arc(-29, 29, '#f2b807', level === 2)}${arc(31, 88, '#dc3a33', level === 3)}${lbl(-60, '관심', '#0a6aa1', level === 1)}${lbl(0, '주의', '#7a5a00', level === 2)}${lbl(60, '심각', '#a3201a', level === 3)}<line x1="${cx}" y1="${cy}" x2="${f1(nx)}" y2="${f1(ny)}" stroke="#2b3a42" stroke-width="3.4" stroke-linecap="round"/><circle cx="${cx}" cy="${cy}" r="6" fill="#fff" stroke="#2b3a42" stroke-width="2.4"/></svg>`;
}
const FRESH_DAYS = 30;       // 발생 후 이 기간(일) 동안만 깜빡이는 표시
const isFresh = (d, now = Date.now()) => { const age = (now - new Date(d + 'T00:00:00')) / 864e5; return age >= 0 && age <= FRESH_DAYS; };
function renderAlert() {
  const D = DATA.disease, el = $('alert');
  if (!D) return;
  const age = Math.floor((Date.now() - new Date(D.asof + 'T00:00:00')) / 864e5);
  const md = s => `${+s.slice(5, 7)}/${+s.slice(8, 10)}`;
  const cls = {'구제역': 'fmd', '럼피스킨': 'lsd', '결핵병': 'tb'};
  el.innerHTML = `<div>
      <div class="ah"><h2>가축질병 위기경보 단계</h2><small>기준 ${D.asof.replace(/-/g, '.')}</small>${age >= 3 ? `<small class="stale">⚠ ${age}일 전 자료</small>` : ''}</div>
      <div class="gs">${D.gauges.map(g => `<div class="g1"><div class="gh"><b>${g.name}</b><span class="pill l${g.level}">${LVNAME[g.level]}</span></div>${gaugeSvg(g.level, g.name)}
        <div class="dt">${g.detail}</div><div class="st">${g.stat}</div><span class="bs ${g.basis}">${g.basisText}</span></div>`).join('')}</div>
      <div class="src">${D.lumpy} · 출처: ${D.sources.map(s => `<a href="${s.url}" target="_blank" rel="noopener noreferrer">${s.name}</a>`).join(' · ')}</div>
    </div>
    <div>
      <div class="ah"><h2>최근 발생 지역</h2><small>시군 단위 · 방역 참고용</small><small class="lg"><i></i>발생 30일 이내</small></div>
      <ul class="rl">${D.recent.slice(0, 6).map(r => `<li><i class="dot${isFresh(r.d) ? '' : ' off'}" style="--c:${DIS[disKey(r.dis)][1]}" ${isFresh(r.d) ? 'role="img" aria-label="발생 30일 이내"' : 'aria-hidden="true"'}></i><span class="d">${md(r.d)}</span><span class="k ${cls[r.dis] || ''}">${r.dis}</span><span class="l">${r.loc} <small>${r.sp}</small></span></li>`).join('')}</ul>
    </div>`;
  el.hidden = false;
}

/* ---------- 전체 그리기 ---------- */
function render() {
  syncMetric();
  emdList.forEach(calcE);
  $('asof').textContent = `한우 ${qLabel(LASTQ)}(${qDate(LASTQ)}) 기준 · KOSIS 가축동향조사 · 받은 날 ${DATA.meta.fetched}`;
  const natVals = feats.filter(f => !thin(f)).map(val);
  const natBr = breaks(natVals);
  let panelVals;

  if (view.level < 2) {
    feats.forEach(f => { f.el.style.fill = colorOf(cls(val(f), natBr)); });
    const pos = natVals.filter(x => x > 0);
    legend(natBr, Math.max(...natVals), (view.level === 0 ? '전국 시군구 기준 (분위수 구간)' : '전국 시군구 기준 · 지역 간 비교용') + ` · ${MLABEL[metric]}`, pos.length ? Math.min(...pos) : 1);
  } else {
    const br = breaks(emdList.map(e => e.v));
    emdList.forEach(e => { e.el.style.fill = colorOf(cls(e.v, br)); });
    const pos = emdList.map(e => e.v).filter(x => x > 0);
    legend(br, Math.max(0, ...emdList.map(e => e.v)), `${view.sg.name} 읍면동 기준 (분위수 구간) · 읍면동 한우 두수(환경조사 ${DATA.emdHwYear})`, pos.length ? Math.min(...pos) : 1);
  }

  // 요약 지표
  let kScope, kTotal, kCount, kUnit, kTop, kNote = '';
  if (view.level === 0) {
    const arr = rankList(feats).filter(f => val(f) > 0).sort((a, b) => val(b) - val(a));
    kScope = '전국'; kNote = bigNote(feats); kTotal = aggFeats(feats); kCount = arr.length; kUnit = '시군구'; kTop = arr[0] ? [rankName(arr[0]), val(arr[0])] : ['-', 0];
  } else if (view.level === 1) {
    const arr = rankList(feats.filter(f => f.code2 === view.sido && val(f) > 0)).sort((a, b) => val(b) - val(a));
    kScope = sidoName[view.sido]; kNote = bigNote(feats.filter(f => f.code2 === view.sido)); kTotal = aggFeats(feats.filter(f => f.code2 === view.sido)); kCount = arr.length; kUnit = '시군구'; kTop = arr[0] ? [rankName(arr[0]), val(arr[0])] : ['-', 0];
  } else {
    const arr = [...emdList].filter(e => e.v > 0).sort((a, b) => b.v - a.v);
    kScope = view.sg.name + ' 읍면동 합계'; kTotal = emdList.reduce((a, e) => a + e.v, 0); kCount = arr.length; kUnit = '읍면동'; kTop = arr[0] ? [arr[0].name, arr[0].v] : ['-', 0];
  }
  // 보조 줄: 두수는 전년 동기 대비, 개수는 전체 중, 1위는 전체 대비 비중
  const scope = view.level === 0 ? feats : view.level === 1 ? feats.filter(f => f.code2 === view.sido) : null;
  const nAll = scope ? scope.filter(repOf).length : emdList.length;
  const yoy = metric === 'hw' && scope ? pctTxt(kTotal, scope.reduce((a, f) => a + (f.hps || 0), 0)) : '';
  const share = ['hw', 'hwfarm'].includes(metric) && kTotal > 0 ? `전체의 ${(kTop[1] / kTotal * 100).toFixed(1)}%` : '';
  const u = s => `<small>${s}</small>`;
  $('kpis').innerHTML =
    `<div class="kpi"><span>${kScope} ${KLAB[metric]}${kNote}</span><b>${fv(kTotal)}${u(KU())}</b><em class="${yoy ? (yoy[0] === '-' ? 'dn' : 'up') : ''}">${yoy ? `${yoy[0] === '-' ? '▼' : '▲'} ${yoy.replace(/^[+-]/, '')} <i class="lg" style="font-style:normal">전년 동기 대비</i><i class="sm" style="font-style:normal">전년비</i>` : ''}</em></div>` +
    `<div class="kpi"><span>자료가 있는 ${kUnit}</span><b>${fmt(kCount)}${u('곳')}</b><em>전체 ${fmt(nAll)}곳 중</em></div>` +
    `<div class="kpi"><span>${ONE() ? '가장 높은' : '가장 많은'} ${kUnit}</span><b>${kTop[0]} ${fv(kTop[1])}${u(KU())}</b><em>${share}</em></div>`;

  // 경로 표시줄
  let c = `<button data-go="top">전국</button>`;
  if (view.level >= 1) c += `<span class="sep">›</span>` + (view.level === 1 ? `<b>${sidoName[view.sido]}</b>` : `<button data-go="sido">${sidoName[view.sido]}</button>`);
  if (view.level === 2) c += `<span class="sep">›</span><b>${view.sg.name}</b>`;
  c += view.level === 0 ? `<span class="hint">시도를 눌러 확대하세요</span>` : `<button class="back" data-go="up">← 뒤로</button>`;
  $('crumbs').innerHTML = c;
  $('crumbs').querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
    const k = b.dataset.go;
    if (k === 'top') goTop(); else if (k === 'sido') goSido(view.sido); else goUp();
  }));

  syncPicker();

  // 오른쪽 목록
  if (view.level === 0) {
    $('t1').textContent = `시도별 ${MLABEL[metric]}`; $('t2').textContent = '시군구 상위 15';
    const groups = {}; feats.forEach(f => (groups[f.code2] = groups[f.code2] || []).push(f));
    const rows = Object.entries(groups).map(([k, l]) => ({label: sidoName[k], v: aggFeats(l), click: () => goSido(k)})).sort((a, b) => b.v - a.v);
    bars($('p1'), rows);
    const top = rankList(feats).filter(f => val(f) > 0).sort((a, b) => val(b) - val(a)).slice(0, 15);
    bars($('p2'), top.map(f => ({label: rankName(f), sub: f.sido, v: val(f), click: () => goSg(f), enter: () => showDetail(sigunguDetail(f))})));
  } else if (view.level === 1) {
    $('t1').textContent = `${sidoName[view.sido]} 시군구별`; $('t2').textContent = `${sidoName[view.sido]} 읍면동 상위 15`;
    const list = feats.filter(f => f.code2 === view.sido).sort((a, b) => val(b) - val(a));
    bars($('p1'), rankList(list).map(f => ({f, label: rankName(f), v: val(f), click: () => goSg(f), enter: () => showDetail(sigunguDetail(f))})));
    $('t2').textContent = `${sidoName[view.sido]} 한우 농가당 두수`;
    const avgL = rankList(feats.filter(f => f.code2 === view.sido && f.hwf > 0)).map(f => ({f, v: f.hw / f.hwf})).sort((a, b) => b.v - a.v);
    const m0 = metric; metric = 'hwavg';
    bars($('p2'), avgL.map(r => ({label: rankName(r.f), v: r.v, click: () => goSg(r.f), enter: () => { metric = 'hwavg'; showDetail(sigunguDetail(r.f)); metric = m0; }})));
    metric = m0;
  } else {
    $('t1').textContent = `${view.sg.name} 읍면동별`; $('t2').textContent = `${sidoName[view.sido]} 시군구 순위`;
    const sorted = [...emdList].sort((a, b) => b.v - a.v);
    bars($('p1'), sorted.map(e => ({label: e.name, v: e.v, click: () => { pinned = (pinned === e ? null : e); markSel(); showContext(); }, enter: () => showDetail(emdDetail(e))})));
    const list = rankList(feats.filter(f => f.code2 === view.sido)).sort((a, b) => val(b) - val(a));
    bars($('p2'), list.map(f => ({label: rankName(f), v: val(f), click: () => goSg(f), enter: () => showDetail(sigunguDetail(f))})), r => r.label === rankName(view.sg));
  }
  markSel();
  showContext();

  $('note').innerHTML = `
    <section class="nt"><h2>자료 출처</h2><ul>
      <li>한우 두수·농가·송아지 비중: <b>KOSIS 가축동향조사</b> ${qLabel(LASTQ)} <span class="dim">(${qDate(LASTQ)} 기준)</span></li>
      <li>읍면동 두수: <b>국립환경과학원</b> ${DATA.emdHwYear}년 <span class="dim">(신고 기준)</span></li>
      <li>시군구 규모별·100두+ 비중: <b>공공데이터포털 15147310</b> <span class="dim">(${DATA.hwYear}.1.1 기준)</span></li>
      <li>경계: 통계청 2018년 <span class="dim">(이후 개편 지역은 실제와 다를 수 있음)</span></li>
    </ul></section>
    <section class="nt warnbox"><h2>주의</h2><ul>
      <li><b>⚠ 표시 지역</b>(강원 등): 규모별 자료가 KOSIS와 20% 넘게 달라 경고와 함께 보이며, 전국·시도 합계에서는 뺍니다.</li>
      <li>읍면동: 이름이 경계와 맞지 않는 법정동(약 5%)은 시군구 합계에만 들어갑니다.</li>
      <li>군위군은 2023년 7월 <b>대구로 편입</b>되어 대구에 포함해 표시합니다(경계는 편입 후 기준으로 수정).</li>
    </ul></section>`;
}


renderAlert();
applyView();
</script>
</body>
</html>
