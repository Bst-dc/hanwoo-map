<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>한우 사육지도</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--fb:"Noto Sans KR","Pretendard","Malgun Gothic",system-ui,sans-serif;--fh:"Noto Serif KR","Batang",serif}
/* 초지: 밝은 초록 (낮에 보기 편한 화면). 자료 없음은 베이지, 가장 낮은 구간은 연두 */
:root{
  --fh:var(--fb);
  --bg:#eef3ea; --panel:#fbfdf8; --ink:#1f2a1c; --muted:#5a6954; --line:#d9e3d2;
  --sea:#e3edf0; --nodata:#d8d1bf; --stroke:#fbfdf8; --prov:#7f9276; --accent:#2f7d3a;
  --r0:#e4f2cf; --r1:#c6e3a0; --r2:#9fd07f; --r3:#72b45e; --r4:#489648; --r5:#2a7640; --r6:#145028;
  --radius:12px; --shadow:0 1px 2px rgba(30,60,30,.08); --maplift:inset 0 0 0 1px #d9e3d2;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--fb);line-height:1.5;transition:background .3s,color .3s}
.wrap{max-width:1220px;margin:0 auto;padding:22px 18px 44px}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px;margin-bottom:14px}
h1{margin:0;font-family:var(--fh);font-size:1.7rem;font-weight:800;letter-spacing:-.02em}
.asof{color:var(--muted);font-size:.82rem;margin-top:2px}
.controls{display:flex;align-items:center;gap:14px;flex-wrap:wrap;font-size:.9rem}
.controls label{color:var(--muted)}
select,button.btn{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:calc(var(--radius) * .6);padding:6px 10px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:calc(var(--radius) * .7);overflow:hidden;background:var(--panel)}
.seg button{font:inherit;font-size:.85rem;color:var(--muted);background:none;border:0;padding:6px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel);font-weight:700}
.seg button:disabled{opacity:.35;cursor:not-allowed}
.kpis{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 16px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:9px 16px;min-width:150px;box-shadow:var(--shadow)}
.kpi span{display:block;font-size:.78rem;color:var(--muted)}
.kpi b{font-family:var(--fh);font-size:1.35rem;font-weight:800;letter-spacing:-.01em}
.grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:820px){.grid{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow)}
.crumbbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-height:34px;margin-bottom:8px;font-size:.92rem}
.crumbbar .sep{color:var(--muted)}
.crumbbar button{font:inherit;background:none;border:0;color:var(--accent);cursor:pointer;padding:2px 5px;border-radius:6px;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.crumbbar b{padding:2px 5px;font-family:var(--fh)}
.crumbbar .back{margin-left:auto;color:var(--ink);border:1px solid var(--line);border-radius:calc(var(--radius) * .6);padding:3px 11px;text-decoration:none}
.hint{color:var(--muted);font-size:.8rem;margin-left:auto}
svg#map{width:100%;height:auto;display:block;background:var(--sea);border-radius:max(2px,calc(var(--radius) - 4px));box-shadow:var(--maplift);transition:background .3s}
svg#map path{vector-effect:non-scaling-stroke}
svg#map path.r,svg#map path.e{fill:var(--nodata)}      /* 색이 입혀지기 전 시작색 (기본 검정이 밝은 화면에서 번쩍이지 않게) */
svg#map path.r{stroke:var(--stroke);stroke-width:.7px;cursor:pointer;transition:opacity .3s,fill .3s}
svg#map path.r.can:hover{stroke:var(--accent);stroke-width:2px}
svg#map path.r.off{pointer-events:none;cursor:default}
svg#map path.e{stroke:var(--stroke);stroke-width:.9px;cursor:pointer}
svg#map path.e:hover{stroke:var(--accent);stroke-width:2.2px}
svg#map path.e.sel{stroke:var(--accent);stroke-width:2.8px}
svg#map path.prov{fill:none;stroke:var(--prov);stroke-width:1.2px;pointer-events:none;opacity:.75;transition:opacity .3s}
svg#map #emdLayer{transition:opacity .4s}
svg#map text{pointer-events:none;text-anchor:middle;dominant-baseline:central;fill:var(--ink);stroke:var(--panel);stroke-linejoin:round;paint-order:stroke;font-weight:700}
.legend{margin-top:12px;font-size:.78rem;color:var(--muted)}
.legend .scope{margin-bottom:6px}
.legend .ramp{display:flex;gap:2px}
.legend .ramp div{flex:1;min-width:0}
.legend .ramp i{display:block;height:10px;border-radius:2px}
.legend .ramp small{display:block;margin-top:3px;font-size:.7rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.legend .nd{display:inline-flex;align-items:center;gap:5px;margin-top:6px}
.legend .nd i{width:12px;height:12px;border-radius:3px;border:1px solid var(--line);background:var(--nodata)}
#tip{position:fixed;z-index:10;pointer-events:none;background:var(--ink);color:var(--panel);padding:5px 10px;border-radius:calc(var(--radius) * .6);font-size:.82rem;line-height:1.35;opacity:0;transition:opacity .08s;white-space:nowrap}
#tip b{font-family:var(--fh)}
.detail{min-height:352px}
.detail h2{margin:0;font-family:var(--fh);font-size:1.2rem;font-weight:800}
.detail .big{font-family:var(--fh);font-size:2.2rem;font-weight:800;letter-spacing:-.02em;color:var(--accent);margin:4px 0 0}
.detail .meta{color:var(--muted);font-size:.85rem}
.detail ol{margin:8px 0 0;padding-left:20px;font-size:.9rem}
.detail li{display:flex;justify-content:space-between;gap:12px;padding:1px 0}
h3,h2.lh{margin:0 0 8px;font-size:.95rem}
/* 막대 목록: 이름 칸은 가장 긴 이름에 맞추고(최대 9.5em) 남는 폭을 모두 막대에 준다 */
.bars{display:grid;grid-template-columns:fit-content(9.5em) minmax(24px,1fr) max-content;gap:3px 8px;align-content:start;max-height:420px;overflow:auto}
.bar{grid-column:1/-1;display:grid;grid-template-columns:subgrid;align-items:center;font-size:.82rem;cursor:pointer;padding:1px 3px;border-radius:6px}
@supports not (grid-template-columns:subgrid){.bar{grid-template-columns:7em minmax(24px,1fr) 4.6em;gap:8px}}
.bar:hover,.bar.sel{background:var(--bg)}
.bar.sel .l{font-weight:700}
.bar .t{height:9px;background:var(--r4);border-radius:5px;min-width:2px}
.bar .n{text-align:right;font-variant-numeric:tabular-nums}
.bar .l{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side{display:grid;gap:16px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:1000px){.two{grid-template-columns:1fr}}
/* 지도 카드와 오른쪽 칸 높이 맞추기
   넓은 화면: 오른쪽 칸은 지도 카드 높이를 따르고(contain:size), 목록이 남는 높이를 채우며 안에서 스크롤.
   상세 칸은 마우스를 올렸을 때의 높이를 미리 잡아 둬서 목록 높이가 흔들리지 않게 한다.
   목록이 너무 낮아지지 않게 오른쪽 칸 최소 높이 = 상세 + 16 + 240 (이보다 지도가 낮으면 지도 카드가 늘어남) */
@media (min-width:1001px){
  .grid{align-items:stretch}
  .side{contain:size;display:flex;flex-direction:column;gap:16px;min-height:608px}
  .side:has(.detail.hw){min-height:776px}
  .side .detail{flex:none}
  .detail.hw{min-height:520px}
  .two{flex:1;min-height:0;grid-auto-rows:minmax(0,1fr)}
  .two .card{display:flex;flex-direction:column;min-height:0}
  .two .bars{flex:1;min-height:0;max-height:none}
}
/* 중간 화면: 상세는 지도 옆(지도 높이로 늘림), 목록 두 개는 아래 전체 폭에 나란히 */
@media (min-width:821px) and (max-width:1000px){
  .grid{align-items:stretch}
  .side{display:contents}
  .two{grid-column:1/-1;grid-template-columns:1fr 1fr}
}
.note{font-size:.78rem;color:var(--muted);margin-top:18px;line-height:1.6}
.empty{color:var(--muted);font-size:.9rem}
.tchart{position:relative;height:58px;margin:8px 0 0 62px;cursor:crosshair}
.tchart svg{display:block;width:100%;height:100%}
.tchart .ty{position:absolute;left:-62px;font-size:.7rem;color:var(--muted);font-variant-numeric:tabular-nums;line-height:1;transform:translateY(-50%)}
.tchart .tdot,.tchart .tcur i{position:absolute;width:7px;height:7px;margin:-3.5px 0 0 -3.5px;border-radius:50%;background:var(--r5);box-shadow:0 0 0 2px var(--panel)}
.tchart .tcur{position:absolute;top:0;bottom:0;width:0;border-left:1px dashed var(--prov);display:none}
.tchart .tcur i{left:0}
.tyr{position:relative;height:16px;margin-left:62px;font-size:.7rem;color:var(--muted)}
.tyr span{position:absolute;top:2px;transform:translateX(-50%);font-variant-numeric:tabular-nums}
.tread{font-size:.8rem;font-variant-numeric:tabular-nums;margin-top:2px;min-height:1.3em}
.szl{display:flex;gap:14px;font-size:.75rem;color:var(--muted);margin:0 0 4px}
.szl i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.sz{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:10px;align-items:center;padding:5px 0;border-top:1px solid var(--line);font-size:.8rem}
.sz .b{display:grid;gap:3px}
.sz .b i{display:block;height:7px;border-radius:2px;min-width:2px}
.sz .n{text-align:right;font-variant-numeric:tabular-nums;line-height:1.35;white-space:nowrap}
.sz .n small{color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><h1>한우 사육지도</h1><div class="asof" id="asof"></div></div>
    <div class="controls">
      <span class="seg" id="metricSeg" role="group" aria-label="한우 지표">
        <button data-m="hw" title="한우 사육 두수 (KOSIS 분기, 시군구)">한우 두수</button><button data-m="hwfarm" title="한우 농가(농장) 수 (KOSIS 분기)">한우 농가</button><button data-m="hwavg" title="한우 농가 1호당 두수">농가당 두수</button><button data-m="calf" title="한육우 중 1세 미만(송아지) 비중 (KOSIS 분기)">송아지 비중</button><button data-m="big" title="100두 이상 농가가 키우는 두수 비중 (공공데이터포털 15147310, 연 1회)">100두+ 비중</button>
      </span>
    </div>
  </header>
  <div class="kpis" id="kpis"></div>

  <div class="grid">
    <div class="card">
      <div class="crumbbar" id="crumbs"></div>
      <svg id="map" role="img" aria-label="한우 사육 지도">
        <g id="regions"></g><g id="emdLayer"></g><path class="prov" id="borders"></path><g id="labels"></g><g id="inset"></g>
      </svg>
      <div class="legend" id="legend"></div>
    </div>

    <div class="side">
      <div class="card detail hw" id="detail"></div>
      <div class="two">
        <div class="card"><h2 class="lh" id="t1"></h2><div class="bars" id="p1"></div></div>
        <div class="card"><h2 class="lh" id="t2"></h2><div class="bars" id="p2"></div></div>
      </div>
    </div>
  </div>

  <p class="note" id="note"></p>
</div>
<div id="tip"></div>

<script>
const DATA = __DATA__;
const fmt = n => Number(n).toLocaleString('ko-KR');
const $ = id => document.getElementById(id);
const NS = 'http://www.w3.org/2000/svg';
const svg = $('map');

let view = {level: 0, sido: null, sg: null};
let pinned = null;          // 읍면동 단계에서 고정한 읍면동
let emdList = [];           // 현재 시군구의 읍면동
let box = null, fullBox = null, anim = 0;

const feats = DATA.feats;
feats.forEach(f => { f.code2 = f.id.slice(0, 2); });
const byId = {}; feats.forEach(f => byId[f.id] = f);
const sidoName = {}; feats.forEach(f => sidoName[f.code2] = f.sido);
let metric = 'hw';          // hw 두수 · hwfarm 농가 수 · hwavg 농가당 · calf 송아지 비중 · big 100두+ 비중
let wantMetric = metric;    // 사용자가 마지막으로 고른 지표 (읍면동 층에서는 한우 두수만 쓸 수 있어 잠시 바뀌어도 기억)
const lastV = a => (a && a.length ? a[a.length - 1] : 0) || 0;
const calfOf = f => lastV(f.kt) > 0 ? lastV(f.ky) / lastV(f.kt) * 100 : 0;
const binSum = b => b.reduce((a, x) => a + x[2], 0);
const bigOf = f => { if (f.obOk === false) return 0; const b = f.hb || [], t = binSum(b); return t > 0 ? b[0][2] / t * 100 : 0; };
const val = f => metric === 'hw' ? (f.hw || 0) : metric === 'hwfarm' ? (f.hwf || 0) : metric === 'hwavg' ? (f.hwf > 0 ? f.hw / f.hwf : 0)
  : metric === 'calf' ? calfOf(f) : bigOf(f);
const ONE = () => ['hwavg', 'calf', 'big'].includes(metric);       // 소수 한 자리로 보이는 지표
const fv = n => ONE() ? Number(n).toFixed(1) : fmt(n);
const UNIT = () => ({hw: '두', hwfarm: '호', hwavg: '두/호', calf: '%', big: '%'}[metric]);
const TIPU = UNIT;
const KU = () => ({hw: '두', hwfarm: '호', hwavg: '두', calf: '%', big: '%'}[metric]);
const MLABEL = {hw: '한우 사육 두수', hwfarm: '한우 농가 수', hwavg: '한우 농가당 두수', calf: '송아지(1세 미만) 비중', big: '100두 이상 농가의 두수 비중'};
const KLAB = {hw: '한우 사육 두수', hwfarm: '한우 농가 수', hwavg: '한우 농가당 평균 두수', calf: '한육우 중 1세 미만 비중', big: '100두 이상 농가의 두수 비중'};
// 구 없이 집계된 시(청주시·광역시 등)는 소속 구마다 같은 값이 들어 있어, 합계·순위에는 대표 구 하나만 넣고 시 이름으로 보여 준다
// (big 은 공공데이터포털 15147310 의 묶음 기준, 나머지는 KOSIS 의 묶음 기준)
const grpOf = f => metric === 'big' ? f.ohg : f.hg;
const repOf = f => !grpOf(f) || (metric === 'big' ? f.ohs > 0 : f.kr === 1);
// 비율·평균 지표는 한우가 1,000두 미만인 지역(과천시 4두 등)이 1위를 차지하지 않도록 순위·색 구간에서 뺀다
const thin = f => ['hwavg', 'calf', 'big'].includes(metric) && (f.hw || 0) < 1000;
const rankList = list => list.filter(f => repOf(f) && !thin(f));
const rankName = f => grpOf(f) || f.name;
const aggFeats = list => {
  const rep = list.filter(repOf).filter(f => metric !== 'big' || f.obOk !== false), sum = fn => rep.reduce((a, f) => a + fn(f), 0);
  if (metric === 'big') { const t = sum(f => binSum(f.hb || [])); return t > 0 ? sum(f => ((f.hb || [])[0] || [0, 0, 0])[2]) / t * 100 : 0; }
  if (metric === 'calf') { const t = sum(f => lastV(f.kt)); return t > 0 ? sum(f => lastV(f.ky)) / t * 100 : 0; }
  const d = list.reduce((a, f) => a + (f.hs || 0), 0), h = list.reduce((a, f) => a + (f.hfs || 0), 0);
  return metric === 'hw' ? d : metric === 'hwfarm' ? h : (h > 0 ? d / h : 0);
};
/* KOSIS 분기 표시 도우미 */
const LASTQ = DATA.kq ? DATA.kq[DATA.kq.length - 1] : null;
const qLabel = q => `${q.slice(0, 4)}년 ${+q.slice(4)}분기`;
const qDate = q => `${q.slice(0, 4)}.${[3, 6, 9, 12][+q.slice(4) - 1]}.1`;
const pctTxt = (a, b) => b > 0 ? `${a >= b ? '+' : ''}${((a / b - 1) * 100).toFixed(1)}%` : '';
const sumSeries = list => {      // 시도·전국: 대표 구만 더한 분기별 한우 두수
  const out = Array(DATA.kq.length).fill(null);
  list.filter(f => !f.hg || f.kr === 1).forEach(f => (f.kh || []).forEach((v, i) => { if (v != null) out[i] = (out[i] || 0) + v; }));
  return out;
};
function calcE(e) { e.v = e.hn || 0; }
function syncMetric() {
  const okW = view.level < 2;                          // KOSIS 한우 지표는 시군구 단위까지
  const okE = !!DATA.hasEmdHw && view.level === 2;     // 읍면동은 환경과학원 한우 두수만
  const allowed = m => m === 'hw' ? okW || okE : okW;
  // 사용자가 고른 지표(wantMetric)를 쓸 수 있으면 그것으로 되돌린다 (읍면동에서 한우 두수로 바뀌었다가 시도·전국으로 나오면 복귀)
  metric = allowed(wantMetric) ? wantMetric : 'hw';
  document.querySelectorAll('#metricSeg button').forEach(b => {
    b.disabled = !allowed(b.dataset.m);
    b.setAttribute('aria-pressed', b.dataset.m === metric);
  });
}

/* ---------- 말풍선 ---------- */
const tipEl = $('tip');
function tip(ev, html) {
  tipEl.innerHTML = html; tipEl.style.opacity = 1;
  const x = Math.min(ev.clientX + 14, window.innerWidth - tipEl.offsetWidth - 8);
  tipEl.style.left = x + 'px'; tipEl.style.top = (ev.clientY + 16) + 'px';
}
function tipOff() { tipEl.style.opacity = 0; }

/* ---------- 지표 선택 ---------- */
document.querySelectorAll('#metricSeg button').forEach(b => b.addEventListener('click', () => { metric = wantMetric = b.dataset.m; render(); }));

/* ---------- 시군구 그리기 ---------- */
const regionsG = $('regions');
feats.forEach(f => {
  const p = document.createElementNS(NS, 'path');
  p.setAttribute('d', f.d);
  p.setAttribute('class', 'r can');
  p.id = 'r' + f.id;
  p.addEventListener('mouseenter', () => { if (canUse(f)) showDetail(sigunguDetail(f)); });
  p.addEventListener('mousemove', ev => { if (canUse(f)) tip(ev, `<b>${f.name}</b> ${fv(val(f))}${TIPU()}`); });
  p.addEventListener('mouseleave', () => { tipOff(); showContext(); });
  p.addEventListener('click', () => {
    if (view.level === 0) goSido(f.code2);
    else if (view.level === 1 && f.code2 === view.sido) goSg(f);
  });
  regionsG.appendChild(p);
  f.el = p;
});
$('borders').setAttribute('d', DATA.borders);
const bb0 = svg.getBBox();
fullBox = {x: bb0.x - 4, y: bb0.y - 4, w: bb0.width + 8, h: bb0.height + 8};
svg.style.aspectRatio = `${fullBox.w} / ${fullBox.h}`;
setBox(fullBox);

function canUse(f) {
  if (view.level === 0) return true;
  if (view.level === 1) return f.code2 === view.sido;
  return false;
}

/* ---------- 확대 ---------- */
function setBox(b) {
  box = b;
  svg.setAttribute('viewBox', `${b.x} ${b.y} ${b.w} ${b.h}`);
}
function animateTo(t, done) {
  cancelAnimationFrame(anim);
  const s = {...box}, t0 = performance.now(), dur = 480;
  const ease = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
  const step = now => {
    const k = Math.min(1, (now - t0) / dur), e = ease(k);
    setBox({x: s.x + (t.x - s.x) * e, y: s.y + (t.y - s.y) * e, w: s.w + (t.w - s.w) * e, h: s.h + (t.h - s.h) * e});

    const cmpTot = (f.hg ? feats.filter(x => x.hg === f.hg && x.code2 === f.code2).reduce((a, x) => a + emdSum(x), 0) : emdSum(f))
      + (f.hg === '대구광역시' ? emdSum(feats.find(x => x.name === '군위군')) : 0);   // KOSIS 대구에는 군위군이 들어 있음
    const share = f.hw > 0 ? cmpTot / f.hw * 100 : 0;
    showDetail(`<h2>${f.sido} ${f.name}</h2>
      <div class="big">${fmt(tot)}<span style="font-size:1rem;font-weight:500;color:var(--ink)"> 두</span></div>
      <div class="meta">한우 · 읍면동 ${emdList.length}곳 · 국립환경과학원 ${DATA.emdHwYear}년</div>
      <div class="meta">${f.hg ? f.hg + ' 전체 ' : ''}환경조사 ${fmt(cmpTot)}두 · KOSIS ${qLabel(LASTQ)} ${fmt(f.hw)}두의 ${share.toFixed(0)}%${f.hw > 0 && (share < 85 || share > 115) ? ' — 두 자료가 크게 달라 읍면동 값은 참고용' : ''}</div>
      <h3 style="margin-top:12px">읍면동 상위</h3>${topList([...emdList].sort((a, b) => b.v - a.v).slice(0, 5).filter(e => e.v > 0).map(e => [e.name, e.v]))}
      ${un2 > 0 ? `<div class="meta" style="margin-top:8px">이름이 경계와 달라 읍면동에 표시하지 못한 ${fmt(un2)}두 (시군구 합계에만 포함)</div>` : ''}`);
  }
}
function markSel() {
  emdList.forEach(e => e.el.classList.toggle('sel', e === pinned));
  document.querySelectorAll('#p1 .bar,#p2 .bar').forEach(b => b.classList.remove('sel'));
  if (view.level === 2 && pinned) {
    const i = [...emdList].sort((a, b) => b.v - a.v).indexOf(pinned);
    const el = document.querySelector(`#p1 .bar[data-i="${i}"]`);
    if (el) el.classList.add('sel');
  }
}

/* ---------- 라벨 ---------- */
function drawLabels() {
  const g = $('labels'); g.innerHTML = '';
  if (view.level === 0) return;
  const s = Math.min(svg.clientWidth / box.w, svg.clientHeight / box.h);
  if (!s) return;
  const px = view.level === 1 ? 11 : 11.5, fs = px / s;
  const items = view.level === 1
    ? feats.filter(f => f.code2 === view.sido).map(f => ({el: f.el, text: f.name}))
    : emdList.map(e => ({el: e.el, text: e.name}));
  items.forEach(it => {
    const b = it.el.getBBox();
    if (b.width * s < it.text.length * px * 0.95 || b.height * s < px * 1.4) return;
    const t = document.createElementNS(NS, 'text');
    t.setAttribute('x', b.x + b.width / 2); t.setAttribute('y', b.y + b.height / 2);
    t.setAttribute('font-size', fs); t.setAttribute('stroke-width', fs * .28);
    t.textContent = it.text;
    g.appendChild(t);
  });
}
window.addEventListener('resize', () => { drawLabels(); drawInset(); });

/* ---------- 전체 그리기 ---------- */
function render() {
  syncMetric();
  emdList.forEach(calcE);
  $('asof').textContent = `한우 ${qLabel(LASTQ)}(${qDate(LASTQ)}) 기준 · KOSIS 가축동향조사 · 받은 날 ${DATA.meta.fetched}`;
  const natVals = feats.filter(f => !thin(f)).map(val);
  const natBr = breaks(natVals);
  let panelVals;

  if (view.level < 2) {
    feats.forEach(f => { f.el.style.fill = colorOf(cls(val(f), natBr)); });
    const pos = natVals.filter(x => x > 0);
    legend(natBr, Math.max(...natVals), (view.level === 0 ? '전국 시군구 기준 (분위수 구간)' : '전국 시군구 기준 · 지역 간 비교용') + ` · ${MLABEL[metric]}`, pos.length ? Math.min(...pos) : 1);
  } else {
    const br = breaks(emdList.map(e => e.v));
    emdList.forEach(e => { e.el.style.fill = colorOf(cls(e.v, br)); });
    const pos = emdList.map(e => e.v).filter(x => x > 0);
    legend(br, Math.max(0, ...emdList.map(e => e.v)), `${view.sg.name} 읍면동 기준 (분위수 구간) · 읍면동 한우 두수(환경조사 ${DATA.emdHwYear})`, pos.length ? Math.min(...pos) : 1);
  }

  // 요약 지표
  let kScope, kTotal, kCount, kUnit, kTop;
  if (view.level === 0) {
    const arr = rankList(feats).filter(f => val(f) > 0).sort((a, b) => val(b) - val(a));
    kScope = '전국'; kTotal = aggFeats(feats); kCount = arr.length; kUnit = '시군구'; kTop = arr[0] ? [rankName(arr[0]), val(arr[0])] : ['-', 0];
  } else if (view.level === 1) {
    const arr = rankList(feats.filter(f => f.code2 === view.sido && val(f) > 0)).sort((a, b) => val(b) - val(a));
    kScope = sidoName[view.sido]; kTotal = aggFeats(feats.filter(f => f.code2 === view.sido)); kCount = arr.length; kUnit = '시군구'; kTop = arr[0] ? [rankName(arr[0]), val(arr[0])] : ['-', 0];
  } else {
    const arr = [...emdList].filter(e => e.v > 0).sort((a, b) => b.v - a.v);
    kScope = view.sg.name + ' 읍면동 합계'; kTotal = emdList.reduce((a, e) => a + e.v, 0); kCount = arr.length; kUnit = '읍면동'; kTop = arr[0] ? [arr[0].name, arr[0].v] : ['-', 0];
  }
  $('kpis').innerHTML =
    `<div class="kpi"><span>${kScope} ${KLAB[metric]}</span><b>${fv(kTotal)}${KU()}</b></div>` +
    `<div class="kpi"><span>자료가 있는 ${kUnit}</span><b>${fmt(kCount)}곳</b></div>` +
    `<div class="kpi"><span>${ONE() ? '가장 높은' : '가장 많은'} ${kUnit}</span><b>${kTop[0]} ${fv(kTop[1])}${ONE() ? KU() : ''}</b></div>`;

  // 경로 표시줄
  let c = `<button data-go="top">전국</button>`;
  if (view.level >= 1) c += `<span class="sep">›</span>` + (view.level === 1 ? `<b>${sidoName[view.sido]}</b>` : `<button data-go="sido">${sidoName[view.sido]}</button>`);
  if (view.level === 2) c += `<span class="sep">›</span><b>${view.sg.name}</b>`;
  c += view.level === 0 ? `<span class="hint">시도를 눌러 확대하세요</span>` : `<button class="back" data-go="up">← 뒤로</button>`;
  $('crumbs').innerHTML = c;
  $('crumbs').querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
    const k = b.dataset.go;
    if (k === 'top') goTop(); else if (k === 'sido') goSido(view.sido); else goUp();
  }));

  // 오른쪽 목록
  if (view.level === 0) {
    $('t1').textContent = `시도별 ${MLABEL[metric]}`; $('t2').textContent = '시군구 상위 15';
    const groups = {}; feats.forEach(f => (groups[f.code2] = groups[f.code2] || []).push(f));
    const rows = Object.entries(groups).map(([k, l]) => ({label: sidoName[k], v: aggFeats(l), click: () => goSido(k)})).sort((a, b) => b.v - a.v);
    bars($('p1'), rows);
    const top = rankList(feats).filter(f => val(f) > 0).sort((a, b) => val(b) - val(a)).slice(0, 15);
    bars($('p2'), top.map(f => ({label: rankName(f), sub: f.sido, v: val(f), click: () => goSg(f), enter: () => showDetail(sigunguDetail(f))})));
  } else if (view.level === 1) {
    $('t1').textContent = `${sidoName[view.sido]} 시군구별`; $('t2').textContent = `${sidoName[view.sido]} 읍면동 상위 15`;
    const list = feats.filter(f => f.code2 === view.sido).sort((a, b) => val(b) - val(a));
    bars($('p1'), rankList(list).map(f => ({label: rankName(f), v: val(f), click: () => goSg(f), enter: () => showDetail(sigunguDetail(f))})));
    $('t2').textContent = `${sidoName[view.sido]} 한우 농가당 두수`;
    const avgL = rankList(feats.filter(f => f.code2 === view.sido && f.hwf > 0)).map(f => ({f, v: f.hw / f.hwf})).sort((a, b) => b.v - a.v);
    const m0 = metric; metric = 'hwavg';
    bars($('p2'), avgL.map(r => ({label: rankName(r.f), v: r.v, click: () => goSg(r.f), enter: () => { metric = 'hwavg'; showDetail(sigunguDetail(r.f)); metric = m0; }})));
    metric = m0;
  } else {
    $('t1').textContent = `${view.sg.name} 읍면동별`; $('t2').textContent = `${sidoName[view.sido]} 시군구 순위`;
    const sorted = [...emdList].sort((a, b) => b.v - a.v);
    bars($('p1'), sorted.map(e => ({label: e.name, v: e.v, click: () => { pinned = (pinned === e ? null : e); markSel(); showContext(); }, enter: () => showDetail(emdDetail(e))})));
    const list = rankList(feats.filter(f => f.code2 === view.sido)).sort((a, b) => val(b) - val(a));
    bars($('p2'), list.map(f => ({label: rankName(f), v: val(f), click: () => goSg(f), enter: () => showDetail(sigunguDetail(f))})), r => r.label === rankName(view.sg));
  }
  markSel();
  showContext();

  $('note').innerHTML = [
    `· 한우 두수·농가: KOSIS 가축동향조사 ${qLabel(LASTQ)}(${qDate(LASTQ)} 기준). 구 없이 집계된 시는 각 구에 같은 값, 합계엔 한 번만.`,
    `· 송아지 비중은 한육우 중 1세 미만. 비율 지표 순위는 한우 1,000두 미만 지역 제외. 시군구 규모별·100두+ 비중은 15147310(${DATA.hwYear}.1.1)이며 KOSIS와 20% 넘게 다른 지역(강원 등)은 숨김.`,
    `· 읍면동 두수: 환경과학원 ${DATA.emdHwYear}(신고 기준, 법정동 약 5%는 시군구에만). 군위군은 KOSIS가 대구에 포함. 경계는 통계청 2018년.`
  ].join('<br>');
}


applyView();
</script>
</body>
</html>
